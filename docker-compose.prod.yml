# FieldDraft — PRODUCTION stack (V-server).
#
# Topology (PLATFORM-ARCHITECTURE.md §3, §11):
#
#   Browser ──TLS──▶ caddy (80/443) ──┬──▶ server :8080 (Go API)  ──▶ db :3306
#                                      └──▶ /srv  (static SPA bundle)
#
#   * db     — MariaDB, NO host-exposed port (in-network only).
#   * server — Go API, NO host-exposed port (Caddy proxies /api/* to it).
#   * caddy  — the ONLY public service; auto-TLS, serves the SPA, proxies the API.
#
# Images are pulled from GHCR by tag on the V-server (§10.2 deploy flow). The
# `build:` blocks let an operator build locally too; `ansible-playbook deploy.yml`
# pulls the tagged images instead.
#
# Secrets come from the environment (an Ansible-Vault–decrypted .env on the
# V-server, or `--env-file .env.prod`). NOTHING is hardcoded — see
# .env.prod.example for the full list.
#
# Validate without a live server:
#   set -a; . ./.env.prod.example; set +a
#   docker compose -f docker-compose.prod.yml config

services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}"
      MARIADB_DATABASE: "${DB_NAME:-fielddraft}"
      MARIADB_USER: "${DB_USER:-fielddraft}"
      MARIADB_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD is required}"
    volumes:
      - db-data:/var/lib/mysql
    # NO `ports:` — the database is never reachable from the public network.
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - internal

  server:
    image: "${REGISTRY:-ghcr.io/sorokan/fielddraft}/server:${TAG:-latest}"
    build:
      # Repo root, not ./server — the Go module replaces the AI-chat proxy to the
      # submodule under third_party/ (ticket #347), which must be in the context.
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    environment:
      # The Go server runs its embedded migrations on startup (server/migrations.go),
      # so no separate migration step is needed — bringing `server` up migrates the DB.
      DB_DSN: "${DB_USER:-fielddraft}:${DB_PASSWORD:?DB_PASSWORD is required}@tcp(db:3306)/${DB_NAME:-fielddraft}?parseTime=true"
      BLOB_DIR: "/data/blobs"
      # Seeds the operator admin on first boot (only if no admin exists yet).
      ADMIN_EMAIL: "${ADMIN_EMAIL:?ADMIN_EMAIL is required}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}"
      # Behind Caddy/TLS → session cookies must carry the Secure attribute.
      SECURE_COOKIES: "1"
      # Behind Caddy the client IP arrives via X-Forwarded-For; TRUST_PROXY=1
      # lets the rate limiter read it (first element). Caddy strips client-
      # supplied XFF from untrusted peers, so the header is trustworthy here.
      TRUST_PROXY: "1"
      # Agent API service tokens (PO + coding desktop agents, WP6). Empty
      # disables that scope; set both to enable the User→Agent loop.
      PO_SERVICE_TOKEN: "${PO_SERVICE_TOKEN:-}"
      CODING_SERVICE_TOKEN: "${CODING_SERVICE_TOKEN:-}"
      # Server-side CGAL meshing (plan §P6): compose-DNS of the mesher
      # service. Empty disables the feature (mesh routes answer 503).
      MESHER_URL: "http://mesher:9090"
      MESH_WORKERS: "${MESH_WORKERS:-2}"
      # Tickets live in IssueVault — the only backend (ticket #346). The token
      # comes from Vault; empty ISSUEVAULT_URL/PROJECT fall back to code
      # defaults. There is no SQL rollback anymore: the ticket domain has one
      # store, on purpose.
      ISSUEVAULT_URL: "${ISSUEVAULT_URL:-}"
      ISSUEVAULT_PROJECT: "${ISSUEVAULT_PROJECT:-}"
      ISSUEVAULT_INSTALLATION: "${ISSUEVAULT_INSTALLATION:-}"
      ISSUEVAULT_TOKEN: "${ISSUEVAULT_TOKEN:-}"
      # AI assistant (ticket #347). The server holds the OpenRouter key and
      # proxies the model calls; empty = feature off (the app hides the chat).
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      # Preferred over the env var in a real deployment: the key is read from a
      # FILE (a mounted secret). An env var is visible in `docker inspect` and in
      # /proc/<pid>/environ; a 0600 file is not.
      OPENROUTER_API_KEY_FILE: "${OPENROUTER_API_KEY_FILE:-}"
      AICHAT_MODELS: "${AICHAT_MODELS:-}"
      # Per-user cap on assistant requests per day (0 = off). The minute-level
      # rate limit stops a burst, not a patient script.
      AICHAT_DAILY_QUOTA: "${AICHAT_DAILY_QUOTA:-}"
      # Onshape import (onshape.go). Unset = the /api/onshape routes answer 503.
      ONSHAPE_ACCESS_KEY: "${ONSHAPE_ACCESS_KEY:-}"
      ONSHAPE_SECRET_KEY: "${ONSHAPE_SECRET_KEY:-}"
    volumes:
      - blob-data:/data/blobs
    # NO `ports:` — only Caddy reaches the API (reverse_proxy server:8080).
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

  # Server-side CGAL mesher (fd-prepare + fd-cgal-mesh + HTTP wrapper).
  # Internal network only — NEVER exposed; only `server` talks to it. Scale
  # horizontally with `docker compose up --scale mesher=N` (compose DNS
  # round-robins), vertically via FD_MESH_THREADS (TBB threads per job).
  mesher:
    image: "${REGISTRY:-ghcr.io/sorokan/fielddraft}/mesher:${TAG:-latest}"
    build:
      context: .
      dockerfile: cgal-mesher/Dockerfile
    restart: unless-stopped
    environment:
      FD_MESH_CONCURRENCY: "${MESH_CONCURRENCY:-2}"
      FD_MESH_THREADS: "${MESH_THREADS:-0}"
      FD_MESH_TIMEOUT_SEC: "${MESH_TIMEOUT_SEC:-300}"
    networks:
      - internal

  caddy:
    image: "${REGISTRY:-ghcr.io/sorokan/fielddraft}/web:${TAG:-latest}"
    build:
      context: .
      dockerfile: web/Dockerfile.prod
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    environment:
      DOMAIN: "${DOMAIN:?DOMAIN is required (e.g. fielddraft.example.com)}"
      TLS_EMAIL: "${TLS_EMAIL:-}"
    volumes:
      # Bind the Caddyfile so DOMAIN/TLS can change without rebuilding the image.
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Persist ACME certs + Caddy state across restarts/deploys.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - server
    networks:
      - internal

volumes:
  db-data:
  blob-data:
  caddy-data:
  caddy-config:

networks:
  internal:
    driver: bridge
