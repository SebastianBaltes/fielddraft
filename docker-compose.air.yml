# Dev-Override: Go-Server mit air-Live-Reload statt gebautem Image.
# Nutzung: just dev-air   (oder: docker compose -f docker-compose.yml
#                          -f docker-compose.air.yml up -d db server mesher)
# ./server ist ins Container-Dateisystem gemountet; air baut bei jeder
# .go-Änderung neu und startet den Prozess durch. Modul-/Build-Caches
# liegen in benannten Volumes, damit der Rebuild nach dem ersten Lauf
# Sekunden statt Minuten dauert. Environment/Ports erbt der Service aus
# docker-compose.yml (Compose merged Overrides).
services:
  server:
    build: !reset null
    image: golang:1.26-alpine
    working_dir: /app
    command: sh -c "go install github.com/air-verse/air@latest && air -c .air.toml"
    volumes:
      - ./server:/app
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
      - blob-data:/data/blobs

volumes:
  go-mod-cache:
  go-build-cache:
