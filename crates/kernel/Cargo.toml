[package]
name = "fielddraft-kernel"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
fielddraft-protocol = { path = "../protocol" }
fielddraft-features-macros = { path = "../features-macros" }
fielddraft-solver = { path = "../solver" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1"
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
nalgebra = "0.33"
num-dual = "0.11"
# Dense Surface Nets meshing for the export path (robust generic mesher
# for non-1-Lipschitz fields: gyroid/TPMS/helix). Battle-tested
# reference implementation; we own only the QEM decimation that follows
# it (see decimate.rs). Pure Rust, wasm-safe.
fast-surface-nets = "0.2"
ndshape = "0.3"
# Deterministic QEM edge-collapse decimation for the export path (see
# decimate.rs). Replaces our hand-written QEM. Pure Rust, wasm-safe.
baby_shark = "0.3"
# Interval-arithmetic octree + Manifold Dual Contouring (fidget_bridge.rs): implicit-surface meshing via interval arithmetic +
# Manifold Dual Contouring. NOTE: v0.3.x has no "mesh" feature — the mesh
# module is always compiled; we only disable the default jit/rhai features
# (jit is native-asm and breaks wasm). Its own Cargo.toml already wires the
# wasm getrandom js shims.
fidget = { version = "0.3", default-features = false }
spade = "2.15"

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
js-sys = "0.3"
