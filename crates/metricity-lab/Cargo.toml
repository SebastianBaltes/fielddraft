[package]
name = "metricity-lab"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["rlib"]

[[bin]]
name = "metricity-lab"
path = "src/main.rs"

# Iteration-3-Forschungs-Spike "offset_tree" (#384, SYNTHESIS §9).
# Reiner Experiment-Code, kein Produktionspfad.
[[bin]]
name = "iter3_offset_tree"
path = "src/bin/iter3_offset_tree.rs"

# A1-Auswahl-Spike 2D-Offset-Bibliothek (#384, OFFSET-TREE-PLAN §5).
# Kandidaten-Vergleich cavalier_contours vs. i_overlay (Flatten-Referenz).
# Dependencies NUR hier im Lab, NICHT im Kernel-Crate.
[[bin]]
name = "a1_offset_lib_spike"
path = "src/bin/a1_offset_lib_spike.rs"

[dependencies]
fielddraft-kernel = { path = "../kernel" }
fielddraft-protocol = { path = "../protocol" }
# Nearest-neighbour queries for the ground-truth surface point cloud.
# Library statt Handrollen (siehe MEMORY: prefer libraries).
kiddo = "5"
# A1-Spike: Kandidaten für 2D-Profil-Offset/Booleans (nur Lab-Dependency).
cavalier_contours = "0.7"
i_overlay = "7"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# A2-Verifikation Erosions-Blatt-Einfalten (#384, offset_tree Phase A2):
# metricity-Vergleich f−δ vs. gefaltetes Blatt, Ausgabe a2_fold_check.csv.
[[bin]]
name = "a2_fold_check"
path = "src/bin/a2_fold_check.rs"
