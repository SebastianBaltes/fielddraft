[package]
name = "metricity-lab"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["rlib"]

[[bin]]
name = "metricity-lab"
path = "src/main.rs"

[dependencies]
fielddraft-kernel = { path = "../kernel" }
fielddraft-protocol = { path = "../protocol" }
# Nearest-neighbour queries for the ground-truth surface point cloud.
# Library statt Handrollen (siehe MEMORY: prefer libraries).
kiddo = "5"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
