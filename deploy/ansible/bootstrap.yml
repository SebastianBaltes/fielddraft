---
# FieldDraft — V-server bootstrap (one-time).
#
#   ansible-playbook -i inventory.ini bootstrap.yml
#
# Installs Docker + the compose plugin, locks the firewall down to 22/80/443,
# creates an unprivileged deploy user, and lays out the base directories. Uses
# only ansible.builtin + apt/ufw (Debian/Ubuntu V-server assumed) so no extra
# collections are required.
#
# NOTE: this pulls Docker from the OFFICIAL docker.com apt repo, which is
# distribution-aware (linux/debian vs linux/ubuntu) below. On a brand-new
# release Docker hasn't published a repo for yet (e.g. a fresh Ubuntu LTS),
# this will 404 — in that case install the distro's own packages instead:
#   apt-get install -y docker.io docker-compose-v2
# (that is exactly how the first live bring-up was done on Ubuntu 26.04).

- name: Bootstrap the FieldDraft V-server
  hosts: vserver
  become: true
  vars:
    docker_apt_arch: amd64
    # linux/debian or linux/ubuntu — derived from the target, not hardcoded.
    docker_apt_distro: "{{ ansible_distribution | lower }}"
    docker_apt_release: "{{ ansible_distribution_release | default('bookworm') }}"

  tasks:
    - name: Install base packages
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - ufw
          - python3
          - rsync
          - restic
        state: present
        update_cache: true

    - name: Create Docker apt keyring dir
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Add Docker GPG key
      ansible.builtin.get_url:
        url: "https://download.docker.com/linux/{{ docker_apt_distro }}/gpg"
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Add Docker apt repository
      ansible.builtin.apt_repository:
        repo: >-
          deb [arch={{ docker_apt_arch }} signed-by=/etc/apt/keyrings/docker.asc]
          https://download.docker.com/linux/{{ docker_apt_distro }} {{ docker_apt_release }} stable
        filename: docker
        state: present

    - name: Install Docker Engine + compose plugin
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Enable and start Docker
      ansible.builtin.service:
        name: docker
        enabled: true
        state: started

    - name: Create the deploy user
      ansible.builtin.user:
        name: "{{ deploy_user }}"
        groups: docker
        append: true
        shell: /bin/bash
        create_home: true

    - name: Create application + data directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        mode: "0750"
      loop:
        - "{{ app_dir }}"
        - "{{ data_root }}"
        - "{{ data_root }}/blobs"
        - "{{ backup_dir }}"

    # ── Firewall: only SSH + HTTP(S) ────────────────────────────────────────
    - name: UFW default deny incoming
      community.general.ufw:
        direction: incoming
        policy: deny

    - name: UFW default allow outgoing
      community.general.ufw:
        direction: outgoing
        policy: allow

    - name: UFW allow 22/80/443
      community.general.ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop:
        - "22"
        - "80"
        - "443"

    - name: Enable UFW
      community.general.ufw:
        state: enabled
