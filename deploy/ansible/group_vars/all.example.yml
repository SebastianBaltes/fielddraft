# FieldDraft — Ansible group vars (example, NON-secret defaults).
#
# Copy to `group_vars/all.yml`. NON-secret config can live here in plaintext.
# SECRETS go in `group_vars/vault.yml`, encrypted with Ansible-Vault:
#
#   cp group_vars/all.example.yml group_vars/all.yml
#   ansible-vault create group_vars/vault.yml        # paste the vault_* block below
#   ansible-playbook -i inventory.ini deploy.yml --ask-vault-pass -e version=<tag>
#
# vault.yml MUST define (these feed .env.prod via deploy.yml's template):
#   vault_db_root_password: "..."
#   vault_db_password:      "..."
#   vault_admin_email:      "admin@example.com"
#   vault_admin_password:   "..."
#   vault_ghcr_user:        "..."        # GHCR username for `docker login`
#   vault_ghcr_token:       "ghp_..."    # GHCR read:packages PAT
#   vault_restic_password:  "..."        # backup repo encryption password
#   vault_restic_repo:      "s3:s3.amazonaws.com/fielddraft-backups"
#   vault_restic_env: { AWS_ACCESS_KEY_ID: "...", AWS_SECRET_ACCESS_KEY: "..." }
# NEVER commit vault.yml decrypted, and NEVER put real secrets in this file.

# ── Identity / paths ────────────────────────────────────────────────────────
deploy_user: fielddraft
app_dir: /opt/fielddraft          # holds compose file, Caddyfile, .env.prod
data_root: /data                  # bind base for blobs/db backups

# ── Domain / TLS ────────────────────────────────────────────────────────────
domain: fielddraft.example.com
tls_email: ops@example.com

# ── Docker install source (bootstrap.yml) ───────────────────────────────────
# false → docker.com apt repo (default). true → the distro's own docker.io +
# docker-compose-v2, for releases Docker's repo doesn't cover yet (e.g. the live
# box on Ubuntu 26.04). Set true there.
use_distro_docker: false

# ── Image registry / version ────────────────────────────────────────────────
registry: ghcr.io/sorokan/fielddraft
# Default tag; override per run with `-e version=<tag>` (also used for rollback).
version: latest

# ── Database (non-secret parts) ─────────────────────────────────────────────
db_name: fielddraft
db_user: fielddraft

# ── Backups ─────────────────────────────────────────────────────────────────
backup_dir: /data/backups          # local staging for nightly dumps
backup_keep_daily: 7
backup_keep_weekly: 4
backup_hour: 3                     # nightly cron hour (server local time)

# ── AI assistant (ticket #347) ───────────────────────────────────────────────
# The chat's model allowlist. The FIRST entry is the model the chat talks to;
# the vision model must be in the list too, or a screenshot turns the turn into
# a 403. Empty = the defaults in server/aichat.go.
#aichat_models: "google/gemini-3-flash-preview,anthropic/claude-sonnet-4.5"
# Assistant requests per user and day (0 = off). The minute rate-limit stops a
# burst; this stops a patient script. Default 300.
#aichat_daily_quota: 300
#
# The KEY belongs in the VAULT (group_vars/vault.yml), never here:
#   vault_openrouter_api_key: "sk-or-…"
# deploy.yml writes it to a 0600 file and mounts it read-only — it is never an
# environment variable. Leave it out and the assistant stays off.
