# FieldDraft — Ansible inventory (example).
#
# Copy to `inventory.ini` and set the real V-server address. The bootstrap
# playbook connects as root (or a sudo-capable user) to create the deploy user;
# subsequent deploys connect as that deploy user.
#
#   ansible-playbook -i inventory.ini bootstrap.yml
#   ansible-playbook -i inventory.ini deploy.yml -e version=v0.6.339

[vserver]
fielddraft.example.com

[vserver:vars]
ansible_user=root
ansible_python_interpreter=/usr/bin/python3
