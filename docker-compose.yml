# M11: dev stack — MariaDB + Go server + Vite frontend.
# Usage: docker compose up (or `just dev` once the justfile is updated).

services:
  db:
    image: mariadb:11
    environment:
      MYSQL_ROOT_PASSWORD: fielddraft
      MYSQL_DATABASE: fielddraft
      MYSQL_USER: fielddraft
      MYSQL_PASSWORD: fielddraft
    ports:
      - "${FIELDDRAFT_DB_PORT:-3306}:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "${FIELDDRAFT_SERVER_PORT:-8080}:8080"
    environment:
      DB_DSN: "fielddraft:fielddraft@tcp(db:3306)/fielddraft?parseTime=true"
      BLOB_DIR: "/data/blobs"
      # Seeds the operator admin on first boot (only if no admin exists yet).
      ADMIN_EMAIL: "${FIELDDRAFT_ADMIN_EMAIL:-}"
      ADMIN_PASSWORD: "${FIELDDRAFT_ADMIN_PASSWORD:-}"
      # Set to 1 behind TLS/Caddy so session cookies get the Secure attribute.
      SECURE_COOKIES: "${FIELDDRAFT_SECURE_COOKIES:-}"
    volumes:
      - blob-data:/data/blobs
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "${FIELDDRAFT_WEB_PORT:-5173}:5173"
    depends_on:
      - server

volumes:
  db-data:
  blob-data:
