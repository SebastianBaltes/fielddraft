# Dev stack — MariaDB + Go server. The frontend is NOT containerized in dev:
# the real dev flow runs Vite on the host (`just dev` / `just dev-full`), which
# proxies /api to the server below.
# Usage: docker compose up --build -d db server            (core stack)
#        docker compose up --build -d db server mesher     (+ CGAL meshing)

services:
  db:
    image: mariadb:11
    # Survive a Docker-daemon/host restart (server + mesher already do). Without
    # this the db stayed down after a daemon restart and the server crash-looped
    # ("database init failed") → the app 502'd until a manual recreate.
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: fielddraft
      MYSQL_DATABASE: fielddraft
      MYSQL_USER: fielddraft
      MYSQL_PASSWORD: fielddraft
    ports:
      - "${FIELDDRAFT_DB_PORT:-3306}:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  server:
    build:
      # Repo root, not ./server — the Go module replaces the AI-chat proxy to the
      # submodule under third_party/ (ticket #347), which must be in the context.
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "${FIELDDRAFT_SERVER_PORT:-8080}:8080"
    environment:
      DB_DSN: "fielddraft:fielddraft@tcp(db:3306)/fielddraft?parseTime=true"
      BLOB_DIR: "/data/blobs"
      # Seeds the operator admin on first boot (only if no admin exists yet).
      # DEV DEFAULTS: a fresh dev DB seeds admin@local / admin so a developer
      # can log in immediately. Override via .env for a real deployment.
      ADMIN_EMAIL: "${FIELDDRAFT_ADMIN_EMAIL:-admin@local}"
      ADMIN_PASSWORD: "${FIELDDRAFT_ADMIN_PASSWORD:-admin}"
      # Agent (PO / coding) Service-Tokens. DEV DEFAULTS make the agent API
      # usable locally; a missing/empty token disables that scope.
      PO_SERVICE_TOKEN: "${FIELDDRAFT_PO_SERVICE_TOKEN:-dev-po}"
      CODING_SERVICE_TOKEN: "${FIELDDRAFT_CODING_SERVICE_TOKEN:-dev-coding}"
      # Set to 1 behind TLS/Caddy so session cookies get the Secure attribute.
      SECURE_COOKIES: "${FIELDDRAFT_SECURE_COOKIES:-}"
      # Server-side CGAL meshing service (internal compose DNS). Empty =
      # feature off, mesh routes answer 503 (plan §P6).
      MESHER_URL: "http://mesher:9090"
      # Tickets live in IssueVault — the only backend (ticket #346; there is no
      # SQL/file fallback left to select). ISSUEVAULT_TOKEN is the
      # installation-bound agent token (kept in the gitignored .env, never here),
      # ISSUEVAULT_INSTALLATION stamps created tickets; URL/PROJECT use code
      # defaults unless overridden. Without a token every ticket call fails 401
      # upstream — loudly, instead of silently writing to a store nobody reads.
      ISSUEVAULT_TOKEN: "${ISSUEVAULT_TOKEN:-}"
      # AI assistant (ticket #347). The server holds the OpenRouter key and
      # proxies the model calls; empty = feature off (the app hides the chat).
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      # Preferred over the env var in a real deployment: the key is read from a
      # FILE (a mounted secret). An env var is visible in `docker inspect` and in
      # /proc/<pid>/environ; a 0600 file is not.
      OPENROUTER_API_KEY_FILE: "${OPENROUTER_API_KEY_FILE:-}"
      AICHAT_MODELS: "${AICHAT_MODELS:-}"
      # Per-user cap on assistant requests per day (0 = off). The minute-level
      # rate limit stops a burst, not a patient script.
      AICHAT_DAILY_QUOTA: "${AICHAT_DAILY_QUOTA:-}"
      ISSUEVAULT_INSTALLATION: "${ISSUEVAULT_INSTALLATION:-}"
      # Onshape import (onshape.go). Unset = the /api/onshape routes answer 503.
      # This key is an identity, not a public-data pass: it reads whatever its
      # Onshape account may read, so the routes stay behind requireAuth.
      ONSHAPE_ACCESS_KEY: "${ONSHAPE_ACCESS_KEY:-}"
      ONSHAPE_SECRET_KEY: "${ONSHAPE_SECRET_KEY:-}"
    volumes:
      - blob-data:/data/blobs
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

  # Server-side CGAL mesher (fd-prepare + fd-cgal-mesh + HTTP wrapper).
  # Internal network only — no published port. Scale horizontally via
  # `docker compose up --scale mesher=N`; TBB threads per job via
  # FD_MESH_THREADS (0 = all cores).
  mesher:
    build:
      context: .
      dockerfile: cgal-mesher/Dockerfile
    environment:
      FD_MESH_CONCURRENCY: "${FIELDDRAFT_MESH_CONCURRENCY:-2}"
      FD_MESH_THREADS: "${FIELDDRAFT_MESH_THREADS:-0}"
      FD_MESH_TIMEOUT_SEC: "${FIELDDRAFT_MESH_TIMEOUT_SEC:-300}"
    restart: unless-stopped

volumes:
  db-data:
  blob-data:
