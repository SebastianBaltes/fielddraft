# Release pipeline — a `v*` tag builds and pushes both production images to
# GHCR (private), tagged with the version AND `latest`.
#
# These are exactly the images the deploy side pulls:
#   * docker-compose.prod.yml -> image: "${REGISTRY:-ghcr.io/sorokan/fielddraft}/server:${TAG}"
#                                        "${REGISTRY:-ghcr.io/sorokan/fielddraft}/web:${TAG}"
#   * deploy/ansible/deploy.yml -e version=<tag>   (pulls REGISTRY/{server,web}:<tag>)
#
# The image namespace therefore MUST be `<registry>/<owner>/fielddraft` with the
# component path `/server` and `/web` — NOT a flat `fielddraft-server` name —
# so the produced refs equal what compose/ansible/.env.prod.example resolve to.
# REGISTRY in the deploy config defaults to ghcr.io/sorokan/fielddraft; we build
# that same base here (owner lower-cased per GHCR rules).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  images:
    name: build + push GHCR images
    runs-on: ubuntu-latest
    steps:
      # `submodules: recursive` is NOT optional (ticket #347): the server's go.mod
      # `replace`s the AI-chat proxy to third_party/baseaichat. Without the
      # submodule the module graph has nothing to resolve and the server image
      # does not build — the release would push web+mesher and silently no server.
      #
      # BaseAIChat is public now; SUBMODULE_TOKEN dates from when it was private
      # (the automatic GITHUB_TOKEN cannot clone a second private repo). The
      # checkout still uses SUBMODULE_TOKEN: a fine-grained PAT with `Contents: read`
      # on BOTH SebastianBaltes/BaseAIChat and .../fielddraft (checkout uses this
      # token for the main repo too). Without the secret the submodule step fails
      # with "Authentication failed" — that is a MISSING SECRET, not a broken URL.
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_TOKEN || secrets.GITHUB_TOKEN }}

      # The tag without the leading refs/tags/ — e.g. v0.6.339. The deploy side
      # passes this same string as `-e version=<tag>` / TAG=<tag>.
      - name: Resolve image base + tag
        id: meta
        run: |
          TAG="${GITHUB_REF_NAME}"
          OWNER="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          BASE="ghcr.io/${OWNER}/fielddraft"
          echo "tag=${TAG}"   >> "$GITHUB_OUTPUT"
          echo "base=${BASE}" >> "$GITHUB_OUTPUT"
          echo "Building ${BASE}/{server,web}:${TAG} (+ :latest)"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- server image: static Go binary (context = REPO ROOT) --------------
      # The context is the repo root, not ./server: the Dockerfile COPYs
      # third_party/baseaichat/server (the go.mod `replace` target), and a path
      # outside the build context does not exist inside the builder.
      - name: Build + push server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.base }}/server:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.base }}/server:latest
          cache-from: type=gha,scope=server
          cache-to: type=gha,scope=server,mode=max

      # --- mesher image: fd-prepare + fd-cgal-mesh + HTTP wrapper -----------
      # Context MUST be the repo root (the Rust stage needs crates/). The
      # golden interpreter-sync test runs INSIDE this build — Rust↔C++ SDF
      # drift fails the release.
      - name: Build + push mesher image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: cgal-mesher/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.base }}/mesher:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.base }}/mesher:latest
          cache-from: type=gha,scope=mesher
          cache-to: type=gha,scope=mesher,mode=max

      # --- web image: wasm → vite → caddy (context = repo root) -------------
      # Context MUST be the repo root so the wasm stage can see crates/ +
      # Cargo.toml (see web/Dockerfile.prod header).
      - name: Build + push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: web/Dockerfile.prod
          push: true
          tags: |
            ${{ steps.meta.outputs.base }}/web:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.base }}/web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
