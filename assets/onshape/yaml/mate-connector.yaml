mate_connector_dialog:
  header:
    name_field: { type: "Text-Input", default_value: "Mate connector 1" }
    actions:
      - ok_button: { type: "Button", color: "Green", icon: "Check" }
      - cancel_button: { type: "Button", color: "Red", icon: "X" }

  state_matrix:
    mode_selection:
      type: "Dropdown"
      options:
        On_entity: { reveals: [origin_selection] }
        Between_entities: { reveals: [origin_selection_1, origin_selection_2] }
    
    alignment_options:
      realign:
        type: "Checkbox"
        label: "Realign"
        reveals_if_checked:
          primary_axis_entity: { type: "Selection-Input", label: "Primary axis entity" }
          secondary_axis_entity: { type: "Selection-Input", label: "Secondary axis entity" }
    
    transformation_options:
      move:
        type: "Checkbox"
        label: "Move"
        reveals_if_checked:
          translation:
            x_input: { type: "Distance-Input", label: "X", default: "0 mm" }
            y_input: { type: "Distance-Input", label: "Y", default: "0 mm" }
            z_input: { type: "Distance-Input", label: "Z", default: "0 mm" }
          rotation:
            axis_dropdown: { type: "Dropdown", label: "Rotate about", options: [X, Y, Z] }
            angle_input: { type: "Angle-Input", label: "Angle", default: "0 deg" }
    
    logic_options:
      owner_entity:
        type: "Checkbox"
        label: "Owner entity"
        default: true
        reveals_if_checked:
          owner_selection: { type: "Selection-Input", label: "Select owner entity" }

  footer:
    help: { type: "Button", icon: "Question-Mark" }
