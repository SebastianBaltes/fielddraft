<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- maximum-scale/user-scalable=no: a CAD viewport handles pinch/drag as
         camera gestures; the browser must not zoom/pan the whole page on touch. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>FieldDraft</title>
    <script>
      // Ticket cztw/4kky/0u31/y2b8: the "Auto-reload on code change" setting
      // (off) must survive EVERY way Vite reloads the page — a `full-reload`
      // message (a non-HMR code change) AND a server restart (e.g. a WASM
      // rebuild), which closes the HMR socket → Vite dispatches
      // `vite:ws:disconnect` → `location.reload()` (browsers won't let us
      // override `location.reload`). Both go through Vite's OWN "message" /
      // "close" listeners on the HMR socket (protocol "vite-hmr").
      //
      // Earlier fixes registered our own listeners first and relied on
      // `stopImmediatePropagation()` to block Vite's — but that depends on
      // listener ORDER, which kept regressing. Instead we now WRAP the socket's
      // `addEventListener`, so we gate Vite's own message/close handlers
      // directly (order-independent): when the setting is off we simply don't
      // forward a `full-reload` payload or the socket `close` to them.
      // Dev-only: no "vite-hmr" socket exists in a production build.
      (function () {
        var KEY = "fielddraft.autoReload";
        function isOff() {
          try {
            return localStorage.getItem(KEY) === "false";
          } catch (e) {
            return false;
          }
        }
        var Native = window.WebSocket;
        if (!Native) return;
        function Patched(url, protocols) {
          var ws = new Native(url, protocols);
          var isViteHmr =
            protocols === "vite-hmr" ||
            (Array.isArray(protocols) && protocols.indexOf("vite-hmr") !== -1);
          if (isViteHmr) {
            var opened = false;
            var origAdd = ws.addEventListener.bind(ws);
            origAdd("open", function () {
              opened = true;
            });
            // Wrap Vite's own message/close listeners so, while off, they never
            // see a full-reload payload or an (established-connection) close.
            ws.addEventListener = function (type, listener, opts) {
              if (
                typeof listener !== "function" ||
                (type !== "message" && type !== "close")
              ) {
                return origAdd(type, listener, opts);
              }
              var wrapped = function (ev) {
                if (isOff()) {
                  if (type === "close") {
                    // Only swallow once the connection had opened — a pre-open
                    // failure must still reach Vite (its reconnect handling).
                    if (opened) {
                      console.info(
                        "[FieldDraft] HMR disconnect→reload suppressed (Auto-reload off). Press F5 to reconnect.",
                      );
                      return;
                    }
                  } else if (typeof ev.data === "string") {
                    try {
                      var msg = JSON.parse(ev.data);
                      var arr = Array.isArray(msg) ? msg : [msg];
                      for (var i = 0; i < arr.length; i++) {
                        if (arr[i] && arr[i].type === "full-reload") {
                          console.info(
                            "[FieldDraft] full-reload suppressed (Auto-reload off). Press F5 to apply code/WASM changes.",
                          );
                          return; // hide this payload from Vite's handler
                        }
                      }
                    } catch (e) {
                      /* not JSON — pass through */
                    }
                  }
                }
                return listener.apply(this, arguments);
              };
              return origAdd(type, wrapped, opts);
            };
          }
          return ws;
        }
        Patched.prototype = Native.prototype;
        Patched.CONNECTING = Native.CONNECTING;
        Patched.OPEN = Native.OPEN;
        Patched.CLOSING = Native.CLOSING;
        Patched.CLOSED = Native.CLOSED;
        window.WebSocket = Patched;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
